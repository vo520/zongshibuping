<!DOCTYPE html>
<html lang="cn">
    <head>
        {include file="header"/}
        <title>[$column.name]-{fox:basic name='title'/}</title>
        <meta name="keywords" content="[$column.keywords]" />
        <meta name="description" content="[$column.description]" />
    </head>
    <body>
        <header class="foxui-border-bottom foxui-bg-white">{include file="nav"/}</header>
        <main>
            <div class="foxcms-common-banner foxui-bg-lighter">{include file="banner"/}</div>
            <div class="foxcms-main list-article-main">
                <div class="foxcms-container">
                    <div class="about-us-tabs" id="aboutUsTabs">
                        <div class="foxui-tabs-header">
                            <!-- Tab items will be loaded here -->
                        </div>
                    </div>
                    <div class="foxui-row foxui-gutter-x-7 foxui-gutter-y-11" id="articleList">
                        <div class="article-loading">
                            <div class="foxui-loading"></div>
                        </div>
                    </div>
                    <div class="foxcms-list-pagination" id="pagination">
                    </div>
                </div>
            </div>
            <div class="foxcms-fixed-container">{include file="fixed"/}</div>
        </main>
        <footer class="wow fadeIn">{include file="footer"/}</footer>
    </body>
    <script src="_STATIC_/skin/js/foxui-1.21.min.js"></script>
    <script src="_STATIC_/skin/js/common.js"></script>
    <script>
    (function() {
        const $list = $('#articleList');
        const $pagination = $('#pagination');
        const $tabs = $('#aboutUsTabs').find('.foxui-tabs-header');
        const currentColumnId = parseInt('{$column.id}');
        const pageSize = 6;

        let currentPage = 1;
        let totalPages = 1;
        let loading = false;
        let currentColumn = null;
        let sections = [];
        let articleRequest = null;
        let lazyObserver = null;
        let paginationBound = false;

        function getUrlParam(name) {
            const match = window.location.search.match(new RegExp('[\?&]' + name + '=([^&]+)'));
            return match ? parseInt(match[1]) : null;
        }

        function updateUrlParam(key, value) {
            const url = new URL(window.location.href);
            url.searchParams.set(key, value);
            window.history.replaceState({}, '', url.toString());
        }

        function initLazyObserver() {
            if (lazyObserver) return lazyObserver;
            
            lazyObserver = new IntersectionObserver(function(entries) {
                entries.forEach(function(entry) {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        const src = img.getAttribute('data-src');
                        if (src) {
                            img.src = src;
                            img.removeAttribute('data-src');
                            img.classList.add('lazy-loaded');
                            lazyObserver.unobserve(img);
                        }
                    }
                });
            }, {
                rootMargin: '200px',
                threshold: 0
            });
            
            return lazyObserver;
        }

        async function loadTabs() {
            try {
                const res = await $.ajax({
                    url: '/api/column/list',
                    type: 'GET',
                    dataType: 'json',
                    cache: true
                });

                if (res.code === 1 && res.data && res.data.length > 0) {
                    const columns = res.data;
                    const parentColumnId = 2;
                    const childSections = [];

                    for (let i = 0; i < columns.length; i++) {
                        const col = columns[i];
                        if (col.pid === parentColumnId && (col.status === 1 || col.status === undefined)) {
                            childSections.push({
                                id: col.nid || 'section_' + col.id,
                                name: col.name,
                                type: col.column_model === 'single' ? 'single' : 'article',
                                columnId: col.id
                            });
                        }
                    }

                    childSections.sort(function(a, b) { return a.columnId - b.columnId; });
                    sections = childSections.length > 0 ? childSections : [{ id: 'default', name: '{$column.name}', type: 'article', columnId: currentColumnId }];
                } else {
                    sections = [{ id: 'default', name: '{$column.name}', type: 'article', columnId: currentColumnId }];
                }

                renderTabs(sections);
                return sections;
            } catch (error) {
                sections = [{ id: 'default', name: '{$column.name}', type: 'article', columnId: currentColumnId }];
                renderTabs(sections);
                return sections;
            }
        }

        function renderTabs(tabs) {
            if (!tabs || tabs.length === 0) {
                $tabs.hide();
                currentColumn = { columnId: currentColumnId };
                return;
            }
            
            const validTabs = [];
            for (let i = 0; i < tabs.length; i++) {
                const tab = tabs[i];
                if (tab && tab.name && tab.columnId) {
                    validTabs.push(tab);
                }
            }
            
            if (validTabs.length === 0) {
                $tabs.hide();
                currentColumn = { columnId: currentColumnId };
                return;
            }
            
            if (validTabs.length === 1) {
                $tabs.hide();
                currentColumn = validTabs[0];
                return;
            }
            
            $tabs.show();
            const urlColumnId = getUrlParam('columnId');
            let activeTab = validTabs.find(function(t) { return t.columnId === urlColumnId; }) || 
                           validTabs.find(function(t) { return t.columnId === currentColumnId; }) || 
                           validTabs[0];
            
            let html = '';
            for (let i = 0; i < validTabs.length; i++) {
                const tab = validTabs[i];
                const isActive = tab.columnId === activeTab.columnId;
                html += '<div class="foxui-tabs-item' + (isActive ? ' is-active' : '') + '" data-section="' + tab.id + '" data-type="' + tab.type + '" data-column-id="' + tab.columnId + '">' + tab.name + '</div>';
            }
            $tabs.html(html);
            
            currentColumn = activeTab;
            updateUrlParam('columnId', activeTab.columnId);
            loadArticles(currentPage, activeTab.columnId);
            
            bindTabEvents();
        }

        function bindTabEvents() {
            $tabs.off('click', '.foxui-tabs-item');
            $tabs.on('click', '.foxui-tabs-item', function() {
                const $this = $(this);
                const sectionId = $this.data('section');
                if (sectionId === currentColumn.id) return;
                
                $tabs.find('.foxui-tabs-item').removeClass('is-active');
                $this.addClass('is-active');
                
                currentColumn = {
                    id: sectionId,
                    type: $this.data('type'),
                    columnId: $this.data('columnId')
                };
                currentPage = 1;
                updateUrlParam('columnId', currentColumn.columnId);
                updateUrlParam('page', 1);
                loadArticles(currentPage, currentColumn.columnId);
            });
        }

        function showSkeleton() {
            let html = '';
            for (let i = 0; i < 3; i++) {
                html += '<div class="foxui-col-md-8"><div class="list-article-item skeleton-item"><div class="pic skeleton-pic"></div><div class="text"><div class="info"><div class="skeleton-line" style="width:80px"></div><div class="skeleton-line" style="width:60px"></div></div><div class="skeleton-line" style="width:90%;height:20px;margin:10px 0"></div><div class="skeleton-line" style="width:100%;height:14px"></div><div class="skeleton-line" style="width:80%;height:14px"></div></div></div></div>';
            }
            $list.html(html);
        }

        function loadArticles(page, columnId) {
            if (loading) return;
            loading = true;
            
            if (articleRequest) {
                articleRequest.abort();
            }
            
            showSkeleton();
            $pagination.hide();
            
            articleRequest = $.ajax({
                url: '/api/article/list',
                type: 'GET',
                data: { columnId: columnId, page: page, pageSize: pageSize },
                dataType: 'json',
                timeout: 10000
            });

            articleRequest.done(function(res) {
                loading = false;
                articleRequest = null;
                
                if (res && res.code === 1 && res.data) {
                    const articles = res.data.list || [];
                    const pagination = res.data.pagination || {};
                    
                    totalPages = Math.max(1, pagination.totalPages || Math.ceil((pagination.total || articles.length) / pageSize));
                    currentPage = page;
                    
                    renderArticlesWithAnimation(articles);
                    renderPagination();
                } else {
                    $list.html('<div class="article-empty">暂无文章</div>');
                    $pagination.hide();
                }
            });

            articleRequest.fail(function(xhr, status) {
                if (status === 'abort') return;
                loading = false;
                articleRequest = null;
                console.error('Article API Error:', status);
                $list.html('<div class="article-empty">加载失败，请刷新页面重试</div>');
                $pagination.hide();
            });
        }

        function renderArticlesWithAnimation(articles) {
            if (!articles || articles.length === 0) {
                $list.html('<div class="article-empty">暂无文章</div>');
                return;
            }
            
            const fragment = document.createDocumentFragment();
            
            for (let i = 0; i < articles.length; i++) {
                const item = articles[i];
                const colDiv = document.createElement('div');
                colDiv.className = 'foxui-col-md-8';
                colDiv.style.opacity = '0';
                colDiv.style.transform = 'translateY(20px)';
                colDiv.dataset.index = i;
                
                colDiv.innerHTML = createArticleHTML(item, i);
                fragment.appendChild(colDiv);
            }
            
            $list.html(fragment);
            
            observeNewImages();
            requestAnimationFrame(function() {
                requestAnimationFrame(function() {
                    animateItemsIn();
                });
            });
        }

        function createArticleHTML(item, index) {
            const imgUrl = item.img_url || '/static/images/noimage.gif';
            const title = item.title || '';
            const content = item.content || item.description || item.brief_title || '';
            const columnName = item.column || '';
            const releaseTime = item.release_time || item.create_time || '';
            const clickCount = item.click_count || item.click || 0;
            const link = item.link || '#';
            
            return '<a href="' + link + '" class="list-article-item"><div class="pic lazy-container" data-aspect-ratio="4/3"><img class="lazy-image" data-src="' + imgUrl + '" alt="' + title + '" /></div><div class="text"><div class="info"><div class="left">' + (columnName ? '<span>' + columnName + '</span>' : '') + (releaseTime ? '<span>' + formatDate(releaseTime) + '</span>' : '') + '</div><div class="right"><i class="foxui-icon-xianshi-o"></i><span>' + clickCount + '</span></div></div><h1 class="foxui-ellipsis-2">' + title + '</h1><p class="foxui-ellipsis-3">' + truncateText(content, 120) + '</p></div></a>';
        }

        function animateItemsIn() {
            const items = $list.find('.foxui-col-md-8:not(.animated)').toArray();
            if (items.length === 0) return;
            
            let delay = 0;
            
            items.forEach(function(item) {
                const $item = $(item);
                
                setTimeout(function() {
                    if (!$item.hasClass('animated')) {
                        $item.css({
                            transition: 'opacity 0.4s ease, transform 0.4s ease',
                            opacity: '1',
                            transform: 'translateY(0)'
                        }).addClass('animated');
                    }
                }, delay);
                
                delay += 80;
            });
        }

        function observeNewImages() {
            const observer = initLazyObserver();
            const images = $list.find('img[data-src]');
            images.each(function() {
                observer.observe(this);
            });
        }

        function renderPagination() {
            if (totalPages <= 1) {
                $pagination.hide();
                return;
            }
            
            $pagination.show();
            let html = '<div class="foxcms-list-pagination">';
            
            html += '<div class="list-pagination-pc foxui-hidden-sm foxui-hidden-xs"><ul class="pagination">';
            html += '<li class="pagepre' + (currentPage <= 1 ? ' disabled' : '') + '"><a href="javascript:void(0)" data-page="' + (currentPage - 1) + '"><i class="foxui-icon-xiangzuo-o"></i></a></li>';
            
            const maxVisible = 5;
            let start = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let end = Math.min(totalPages, start + maxVisible - 1);
            
            for (let i = start; i <= end; i++) {
                html += '<li class="pageno' + (i === currentPage ? ' active' : '') + '"><a href="javascript:void(0)" data-page="' + i + '">' + i + '</a></li>';
            }
            
            html += '<li class="pagenext' + (currentPage >= totalPages ? ' disabled' : '') + '"><a href="javascript:void(0)" data-page="' + (currentPage + 1) + '"><i class="foxui-icon-xiangyou-o"></i></a></li>';
            html += '</ul></div>';
            
            html += '<div class="list-pagination-h5 foxui-visible-sm foxui-visible-xs"><ul class="pagination">';
            html += '<li class="pagepre' + (currentPage <= 1 ? ' disabled' : '') + '"><a href="javascript:void(0)" data-page="' + (currentPage - 1) + '"><i class="foxui-icon-xiangzuo-o"></i></a></li>';
            
            for (let i = start; i <= end; i++) {
                html += '<li class="pageno' + (i === currentPage ? ' active' : '') + '"><a href="javascript:void(0)" data-page="' + i + '">' + i + '</a></li>';
            }
            
            html += '<li class="pagenext' + (currentPage >= totalPages ? ' disabled' : '') + '"><a href="javascript:void(0)" data-page="' + (currentPage + 1) + '"><i class="foxui-icon-xiangyou-o"></i></a></li>';
            html += '</ul></div></div>';
            
            $pagination.html(html);
            bindPaginationEvents();
        }

        function bindPaginationEvents() {
            if (paginationBound) return;
            paginationBound = true;
            
            $pagination.on('click', 'a', function(e) {
                e.preventDefault();
                const $link = $(this);
                const $li = $link.parent('li');
                if ($li && $li.hasClass('disabled')) return;
                const page = parseInt($link.data('page'));
                if (page >= 1 && page <= totalPages && page !== currentPage) {
                    currentPage = page;
                    updateUrlParam('page', page);
                    loadArticles(currentPage, currentColumn.columnId);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
        }

        function truncateText(text, length) {
            const plainText = text.replace(/<[^>]*>/g, '');
            return plainText.length > length ? plainText.substring(0, length) + '...' : plainText;
        }

        $(document).ready(async function() {
            currentPage = getUrlParam('page') || 1;
            const urlColumnId = getUrlParam('columnId');
            const targetColumnId = urlColumnId || currentColumnId;
            
            initLazyObserver();
            
            await loadTabs();
            loadArticles(currentPage, targetColumnId);
        });
    })();
    </script>
</html>
