<!DOCTYPE html>
<html lang="cn">
    <head>
        {include file="header"/}
        <title>关于我们-{fox:basic name='title'/}</title>
        <meta name="keywords" content="关于我们" />
        <meta name="description" content="了解更多关于我们的信息" />
    </head>
    <body>
        <header class="foxui-border-bottom foxui-bg-white">{include file="nav"/}</header>
        <main>
            <div class="foxcms-common-banner foxui-bg-lighter">{include file="banner"/}</div>
            <div class="foxcms-main about-us-main foxcms-responsive-padding">
                <div class="foxcms-container">
                    <div class="about-us-tabs" id="aboutUsTabs">
                        <div class="foxui-tabs-header"></div>
                    </div>
                    <div class="about-us-content" id="aboutUsContent">
                        <div class="about-us-loading">
                            <div class="foxui-loading"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="foxcms-fixed-container">{include file="fixed"/}</div>
        </main>
        <footer class="wow fadeIn">{include file="footer"/}</footer>
        <script src="_STATIC_/skin/js/foxui-1.21.min.js"></script>
        <script src="_STATIC_/skin/js/common.js"></script>
        <script>
        (function() {
            const CONFIG = {
                API_COLUMN_LIST: '/api/column/list',
                API_SINGLE: '/api/other/single',
                API_ARTICLE_LIST: '/api/article/list',
                DEFAULT_COLUMNS: [
                    { id: 'about', name: '公司简介', type: 'single', columnId: 7 },
                    { id: 'honor', name: '荣誉资质', type: 'article', columnId: 8 },
                    { id: 'team', name: '核心团队', type: 'article', columnId: 9 },
                    { id: 'customer', name: '合作客户', type: 'article', columnId: 10 }
                ],
                HONOR_COLUMN_ID: 8,
                TEAM_COLUMN_ID: 9,
                CUSTOMER_COLUMN_ID: 10,
                ARTICLE_PAGE_SIZE: 50
            };

            const $tabs = $('#aboutUsTabs .foxui-tabs-header');
            const $content = $('#aboutUsContent');
            let currentTabId = null;
            let contentCache = {};

            const AboutUsModule = {
                init() {
                    this.loadTabs();
                },

                loadTabs() {
                    $.ajax({
                        url: CONFIG.API_COLUMN_LIST,
                        type: 'GET',
                        dataType: 'json',
                        success: this.handleTabLoadSuccess.bind(this),
                        error: this.handleTabLoadError.bind(this)
                    });
                },

                handleTabLoadSuccess(res) {
                    if (res.code === 1 && res.data && res.data.length > 0) {
                        const childSections = res.data
                            .filter(col => col.pid === 1 && col.status === 1)
                            .map(col => ({
                                id: col.nid || 'section_' + col.id,
                                name: col.name,
                                type: col.column_model === 'single' ? 'single' : 'article',
                                columnId: col.id
                            }))
                            .sort((a, b) => a.columnId - b.columnId);
                        
                        this.renderTabs(childSections.length > 0 ? childSections : CONFIG.DEFAULT_COLUMNS);
                    } else {
                        this.renderTabs(CONFIG.DEFAULT_COLUMNS);
                    }
                },

                handleTabLoadError() {
                    this.renderTabs(CONFIG.DEFAULT_COLUMNS);
                },

                renderTabs(sections) {
                    if (!sections || sections.length === 0) {
                        $content.html('<div class="about-us-empty">暂无栏目信息</div>');
                        return;
                    }

                    const validTabs = sections.filter(s => s && s.name && s.columnId);
                    if (validTabs.length === 0) {
                        $content.html('<div class="about-us-empty">暂无栏目信息</div>');
                        return;
                    }

                    const html = validTabs.map((section, index) => 
                        `<div class="foxui-tabs-item${index === 0 ? ' is-active' : ''}" 
                            data-section="${section.id}" 
                            data-type="${section.type}" 
                            data-column-id="${section.columnId}">${section.name}</div>`
                    ).join('');

                    $tabs.html(html);
                    currentTabId = validTabs[0].id;
                    this.loadContent(validTabs[0]);
                    this.bindTabEvents();
                },

                bindTabEvents() {
                    $tabs.on('click', '.foxui-tabs-item', (e) => {
                        const $this = $(e.currentTarget);
                        const sectionId = $this.data('section');
                        
                        if (sectionId === currentTabId) return;
                        
                        $tabs.find('.foxui-tabs-item').removeClass('is-active');
                        $this.addClass('is-active');
                        currentTabId = sectionId;
                        
                        this.loadContent({
                            id: sectionId,
                            type: $this.data('type'),
                            columnId: $this.data('columnId')
                        });
                    });
                },

                loadContent(section) {
                    if (!section || !section.columnId) {
                        $content.html('<div class="about-us-empty">参数错误</div>');
                        return;
                    }

                    const cacheKey = section.id || section.columnId;
                    
                    if (contentCache[cacheKey]) {
                        this.renderContent(cacheKey);
                        return;
                    }

                    $content.html('<div class="about-us-loading"><div class="foxui-loading"></div></div>');

                    if (section.type === 'single') {
                        this.loadSingleContent(section.columnId, cacheKey);
                    } else {
                        this.loadArticleList(section.columnId, cacheKey, section.id);
                    }
                },

                loadSingleContent(columnId, cacheKey) {
                    $.ajax({
                        url: CONFIG.API_SINGLE,
                        type: 'GET',
                        data: { columnId },
                        dataType: 'json',
                        success: (res) => {
                            contentCache[cacheKey] = { 
                                type: 'single', 
                                data: res.code === 1 && res.data ? res.data : { content: '' } 
                            };
                            this.renderContent(cacheKey);
                        },
                        error: () => {
                            $content.html('<div class="about-us-error">加载失败，请刷新页面重试</div>');
                        }
                    });
                },

                loadArticleList(columnId, cacheKey, sectionId) {
                    $.ajax({
                        url: CONFIG.API_ARTICLE_LIST,
                        type: 'GET',
                        data: { columnId, pageSize: CONFIG.ARTICLE_PAGE_SIZE },
                        dataType: 'json',
                        success: (res) => {
                            const list = res.code === 1 && res.data ? (res.data.list || res.data) : [];
                            contentCache[cacheKey] = { type: 'article', data: list, sectionId };
                            this.renderContent(cacheKey);
                        },
                        error: () => {
                            $content.html('<div class="about-us-error">加载失败，请刷新页面重试</div>');
                        }
                    });
                },

                renderContent(cacheKey) {
                    const cached = contentCache[cacheKey];
                    if (!cached) {
                        $content.html('<div class="about-us-empty">暂无内容</div>');
                        return;
                    }

                    let html = '';
                    if (cached.type === 'single') {
                        const content = cached.data.content || '';
                        html = content.trim() ? 
                            `<div class="about-us-body rich-text">${content}</div>` : 
                            '<div class="about-us-empty">暂无内容</div>';
                    } else if (cached.type === 'article') {
                        const articles = cached.data || [];
                        html = articles.length > 0 ? 
                            this.renderArticleList(articles, cached.sectionId) : 
                            '<div class="about-us-empty"><div class="empty-icon"><i class="foxui-icon-tupian1"></i></div><p>暂无内容</p></div>';
                    }

                    $content.html(html);
                    this.initLazyForNewContent();
                },

                initLazyForNewContent() {
                    if (FoxModules && FoxModules.LazyLoad) {
                        $content.find('img[data-src]').each(function() {
                            const $img = $(this);
                            if ($img.hasClass('lazy-loaded') || $img.hasClass('lazy-loading')) return;
                            
                            const src = $img.attr('data-src');
                            if (src) {
                                const srcset = $img.attr('data-srcset');
                                if (srcset) $img.attr('srcset', srcset).removeAttr('data-srcset');
                                $img.attr('src', src).removeAttr('data-src').addClass('lazy-loaded');
                                
                                const $container = $img.closest('.lazy-container');
                                if ($container.length) $container.addClass('lazy-loaded');
                            }
                        });
                    }
                },

                renderArticleList(articles, sectionId) {
                    const match = sectionId ? sectionId.match(/(\d+)$/) : null;
                    const columnId = match ? parseInt(match[1]) : 0;

                    const isHonor = columnId === CONFIG.HONOR_COLUMN_ID || sectionId === 'honor';
                    const isTeam = columnId === CONFIG.TEAM_COLUMN_ID || sectionId === 'team';
                    const isCustomer = columnId === CONFIG.CUSTOMER_COLUMN_ID || sectionId === 'customer';

                    if (isHonor) return this.renderHonorGrid(articles);
                    if (isTeam) return this.renderTeamList(articles);
                    if (isCustomer) return this.renderCustomerGrid(articles);
                    return this.renderArticleGrid(articles);
                },

                renderHonorGrid(articles) {
                    return `<div class="foxcms-honor-grid">${articles.map((item, i) => `
                        <div class="foxcms-honor-item wow fadeIn" data-wow-delay="${((i % 4 * 0.1) + 0.1)}s" data-wow-duration="0.6s">
                            <div class="foxcms-honor-pic lazy-container${item.img_url ? '' : ' no-image'}">
                                ${item.img_url ? `<img class="lazy-image" data-src="${item.img_url}" alt="${item.title || ''}" />` : '<div class="no-image-placeholder"><i class="foxui-icon-tupian1"></i></div>'}
                            </div>
                            <div class="foxcms-honor-title">${item.title || ''}</div>
                        </div>
                    `).join('')}</div>`;
                },

                renderTeamList(articles) {
                    return `<div class="foxcms-team-list">${articles.map((item, i) => `
                        <div class="foxcms-team-item wow fadeIn" data-wow-delay="${(i * 0.15 + 0.1)}s" data-wow-duration="0.6s">
                            <div class="foxcms-team-pic lazy-container${item.img_url ? '' : ' no-image'}" data-aspect-ratio="4/3">
                                ${item.img_url ? `<img class="lazy-image" data-src="${item.img_url}" alt="${item.title || ''}" />` : '<div class="no-image-placeholder"><i class="foxui-icon-tupian1"></i></div>'}
                            </div>
                            <div class="foxcms-team-info">
                                <h3>${item.title || ''}</h3>
                                ${(item.description || item.brief) ? `<p>${item.description || item.brief}</p>` : ''}
                            </div>
                        </div>
                    `).join('')}</div>`;
                },

                renderCustomerGrid(articles) {
                    return `<div class="foxcms-customer-grid">${articles.map((item, i) => `
                        <div class="foxcms-customer-item wow fadeIn" data-wow-delay="${((i % 6 * 0.1) + 0.1)}s" data-wow-duration="0.5s">
                            <div class="foxcms-customer-pic lazy-container${item.img_url ? '' : ' no-image'}">
                                ${item.img_url ? `<img class="lazy-image" data-src="${item.img_url}" alt="${item.title || ''}" />` : '<div class="no-image-placeholder"><i class="foxui-icon-tupian1"></i></div>'}
                            </div>
                        </div>
                    `).join('')}</div>`;
                },

                renderArticleGrid(articles) {
                    return `<div class="foxcms-article-grid">${articles.map((item, i) => `
                        <div class="foxcms-article-item wow fadeInUp" data-wow-delay="${((i % 3 * 0.1) + 0.1)}s" data-wow-duration="0.6s">
                            <div class="foxcms-article-pic lazy-container${item.img_url ? '' : ' no-image'}" data-aspect-ratio="16/9">
                                ${item.img_url ? `<img class="lazy-image" data-src="${item.img_url}" alt="${item.title || ''}" />` : '<div class="no-image-placeholder"><i class="foxui-icon-tupian1"></i></div>'}
                            </div>
                            <div class="foxcms-article-info">
                                <h3>${item.title || ''}</h3>
                                ${item.description ? `<p>${item.description}</p>` : ''}
                            </div>
                        </div>
                    `).join('')}</div>`;
                }
            };

            $(document).ready(() => {
                AboutUsModule.init();
            });
        })();
        </script>
    </body>
</html>
