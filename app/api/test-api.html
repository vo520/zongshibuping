<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoxCMS API 测试工具</title>
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --success: #4ec9b0;
            --error: #f44747;
            --warning: #dcdcaa;
            --bg: #f0f2f5;
            --sidebar-bg: #ffffff;
            --card-bg: #ffffff;
            --text: #333;
            --text-muted: #666;
            --border: #e0e0e0;
            --code-bg: #1e1e1e;
            --code-text: #d4d4d4;
            --sidebar-width: 280px;
        }
        [data-theme="dark"] {
            --bg: #1a1a2e;
            --sidebar-bg: #16213e;
            --card-bg: #1e2a4a;
            --text: #eee;
            --text-muted: #aaa;
            --border: #2d3a5a;
            --code-bg: #0d1117;
            --code-text: #c9d1d9;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
        .app { display: flex; flex-direction: column; height: 100vh; }
        
        /* Header */
        .header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .header h1 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .header-controls { display: flex; gap: 10px; align-items: center; }
        .theme-toggle { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: all 0.3s; }
        .theme-toggle:hover { background: rgba(255,255,255,0.3); }
        .base-url-input { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 8px 14px; border-radius: 6px; font-size: 14px; width: 220px; }
        .base-url-input::placeholder { color: rgba(255,255,255,0.7); }
        .base-url-input:focus { outline: none; background: rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.5); }
        
        /* Main Content */
        .main { display: flex; flex: 1; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: var(--sidebar-width); background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
        .sidebar-search { padding: 10px 12px; border-bottom: 1px solid var(--border); }
        .sidebar-search input { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background: var(--bg); color: var(--text); }
        .sidebar-search input:focus { outline: none; border-color: var(--primary); }
        .api-list { flex: 1; overflow-y: auto; padding: 8px 0; }
        .api-category { margin-bottom: 4px; }
        .api-category-title { padding: 8px 16px; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; user-select: none; }
        .api-category-title:hover { background: var(--bg); }
        .api-category-title .arrow { transition: transform 0.2s; }
        .api-category.collapsed .api-category-title .arrow { transform: rotate(-90deg); }
        .api-category.collapsed .api-items { display: none; }
        .api-item { padding: 8px 16px 8px 24px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.2s; border-left: 3px solid transparent; }
        .api-item:hover { background: var(--bg); }
        .api-item.active { background: rgba(102,126,234,0.1); border-left-color: var(--primary); }
        .api-item .method { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 3px; min-width: 42px; text-align: center; }
        .api-item .method.get { background: #61affe20; color: #61affe; }
        .api-item .method.post { background: #49cc9020; color: #49cc90; }
        .api-item .method.put { background: #fca13020; color: #fca130; }
        .api-item .method.delete { background: #f93e3e20; color: #f93e3e; }
        .api-item .path { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
        
        /* Content Panel */
        .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Request Section */
        .request-section { border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .request-bar { display: flex; align-items: center; padding: 12px 16px; gap: 10px; background: var(--card-bg); }
        .method-select { padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border); font-size: 14px; font-weight: 600; background: var(--card-bg); cursor: pointer; min-width: 100px; color: var(--text); }
        .url-input { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; font-family: 'Consolas', monospace; background: var(--card-bg); color: var(--text); }
        .url-input:focus { outline: none; border-color: var(--primary); }
        .send-btn { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; border: none; padding: 10px 24px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.3s; }
        .send-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102,126,234,0.4); }
        .send-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        /* Request Tabs */
        .request-tabs { display: flex; background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 0 16px; }
        .request-tab { padding: 10px 16px; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--text-muted); transition: all 0.2s; }
        .request-tab:hover { color: var(--text); }
        .request-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab-badge { background: var(--bg); padding: 2px 6px; border-radius: 10px; font-size: 11px; margin-left: 4px; }
        
        /* Request Content */
        .request-content { background: var(--card-bg); min-height: 150px; max-height: 250px; overflow-y: auto; }
        .request-content.hidden { display: none; }
        .params-grid { padding: 12px 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
        .param-item { display: flex; flex-direction: column; gap: 4px; }
        .param-item label { font-size: 11px; color: var(--text-muted); font-weight: 500; display: flex; align-items: center; gap: 4px; }
        .param-item input { padding: 8px 10px; border: 1px solid var(--border); border-radius: 5px; font-size: 13px; background: var(--bg); color: var(--text); }
        .param-item input:focus { outline: none; border-color: var(--primary); }
        .empty-state { padding: 30px; text-align: center; color: var(--text-muted); font-size: 13px; }
        
        /* Response Section */
        .response-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--card-bg); }
        .response-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .response-title { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .status-badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .status-badge.success { background: #4ec9b020; color: var(--success); }
        .status-badge.error { background: #f4474720; color: var(--error); }
        .status-badge.pending { background: #dcdcaa20; color: var(--warning); }
        .response-meta { display: flex; gap: 16px; font-size: 12px; color: var(--text-muted); }
        .response-meta span { display: flex; align-items: center; gap: 4px; }
        .response-actions { display: flex; gap: 6px; }
        .response-btn { padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; transition: all 0.2s; }
        .response-btn.copy { background: #28a745; color: white; }
        .response-btn.copy:hover { background: #218838; }
        .response-btn.curl { background: #17a2b8; color: white; }
        .response-btn.curl:hover { background: #138496; }
        .response-btn.clear { background: #dc3545; color: white; }
        .response-btn.clear:hover { background: #c82333; }
        
        /* Response Body */
        .response-body { flex: 1; overflow: auto; }
        .response-box { background: var(--code-bg); color: var(--code-text); padding: 16px; font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; min-height: 100%; }
        .json-key { color: #9cdcfe; }
        .json-string { color: #ce9178; }
        .json-number { color: #b5cea8; }
        .json-boolean { color: #569cd6; }
        .json-null { color: #569cd6; }
        .json-bracket { color: #ffd700; }
        .json-collapsed { cursor: pointer; background: rgba(255,255,255,0.1); padding: 0 4px; border-radius: 3px; }
        .json-collapsed:hover { background: rgba(255,255,255,0.2); }
        
        /* History Panel */
        .history-section { border-top: 1px solid var(--border); max-height: 200px; overflow-y: auto; flex-shrink: 0; }
        .history-header { padding: 8px 16px; font-size: 12px; font-weight: 600; color: var(--text-muted); background: var(--bg); position: sticky; top: 0; }
        .history-item { padding: 8px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 12px; transition: background 0.2s; }
        .history-item:hover { background: var(--bg); }
        .history-item .method { font-weight: 700; min-width: 50px; font-size: 10px; }
        .history-item .method.get { color: #61affe; }
        .history-item .method.post { color: #49cc90; }
        .history-item .method.put { color: #fca130; }
        .history-item .method.delete { color: #f93e3e; }
        .history-item .path { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: monospace; }
        .history-item .status { color: var(--text-muted); }
        .history-item .time { color: var(--text-muted); font-size: 11px; }
        .empty-history { padding: 20px; text-align: center; color: var(--text-muted); font-size: 12px; }
        
        /* cURL Modal */
        .curl-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center; }
        .curl-modal.show { display: flex; }
        .curl-modal-content { background: var(--card-bg); border-radius: 12px; padding: 24px; max-width: 700px; width: 90%; max-height: 80vh; overflow: auto; }
        .curl-modal h3 { margin-bottom: 15px; color: var(--text); }
        .curl-modal pre { background: var(--code-bg); color: var(--code-text); padding: 15px; border-radius: 8px; overflow-x: auto; font-size: 12px; margin-bottom: 15px; white-space: pre-wrap; }
        .curl-modal .btn-group { display: flex; gap: 8px; justify-content: flex-end; }
        .modal-btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
        .modal-btn.close { background: var(--bg); color: var(--text); }
        .modal-btn.copy { background: #28a745; color: white; }
        
        /* Shortcuts */
        .shortcuts-bar { padding: 8px 16px; background: var(--bg); font-size: 11px; color: var(--text-muted); display: flex; gap: 16px; border-top: 1px solid var(--border); flex-shrink: 0; }
        .shortcuts-bar kbd { background: var(--card-bg); border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px; font-family: inherit; margin-right: 4px; }
        
        /* Responsive */
        @media (max-width: 900px) {
            :root { --sidebar-width: 220px; }
            .params-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 700px) {
            .sidebar { display: none; }
            .response-meta { display: none; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>🚀 FoxCMS API</h1>
            <div class="header-controls">
                <input type="url" class="base-url-input" id="baseUrl" placeholder="http://localhost" list="baseUrlList">
                <datalist id="baseUrlList">
                    <option value="http://localhost">
                    <option value="http://127.0.0.1">
                    <option value="https://localhost">
                </datalist>
                <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">🌓</button>
            </div>
        </header>
        
        <div class="main">
            <aside class="sidebar">
                <div class="sidebar-header">📚 API 列表</div>
                <div class="sidebar-search">
                    <input type="text" id="searchApi" placeholder="搜索 API..." oninput="filterApis()">
                </div>
                <div class="api-list" id="apiList"></div>
            </aside>
            
            <main class="content">
                <section class="request-section">
                    <div class="request-bar">
                        <select id="method" class="method-select">
                            <option value="GET">GET</option>
                            <option value="POST">POST</option>
                            <option value="PUT">PUT</option>
                            <option value="DELETE">DELETE</option>
                        </select>
                        <input type="text" id="urlInput" class="url-input" placeholder="/api/column/list" value="/api/column/list">
                        <button class="send-btn" id="sendBtn" onclick="sendRequest()">发送</button>
                    </div>
                    <div class="request-tabs">
                        <div class="request-tab active" data-tab="params" onclick="switchTab('params')">参数 <span class="tab-badge" id="paramsCount">0</span></div>
                        <div class="request-tab" data-tab="headers" onclick="switchTab('headers')">Headers</div>
                    </div>
                    <div class="request-content" id="paramsContent">
                        <div class="params-grid" id="paramsGrid"></div>
                        <div class="empty-state" id="paramsEmpty">点击左侧 API 或直接输入 URL 开始测试</div>
                    </div>
                    <div class="request-content hidden" id="headersContent">
                        <div class="params-grid">
                            <div class="param-item">
                                <label>Content-Type</label>
                                <input type="text" value="application/json" readonly>
                            </div>
                            <div class="param-item">
                                <label>Accept</label>
                                <input type="text" value="application/json" readonly>
                            </div>
                        </div>
                    </div>
                </section>
                
                <section class="response-section">
                    <div class="response-header">
                        <div class="response-title">
                            <span>响应</span>
                            <span class="status-badge pending" id="statusBadge">-</span>
                            <div class="response-meta">
                                <span id="respTime">- ms</span>
                                <span id="respSize">-</span>
                            </div>
                        </div>
                        <div class="response-actions">
                            <button class="response-btn curl" onclick="showCurlModal()">cURL</button>
                            <button class="response-btn copy" onclick="copyResponse()">复制</button>
                            <button class="response-btn clear" onclick="clearResponse()">清空</button>
                        </div>
                    </div>
                    <div class="response-body">
                        <div class="response-box" id="responseBox">点击发送按钮或使用快捷键发送请求...</div>
                    </div>
                </section>
                
                <div class="history-section">
                    <div class="history-header">📜 请求历史</div>
                    <div id="historyList"><div class="empty-history">暂无请求历史</div></div>
                </div>
                
                <div class="shortcuts-bar">
                    <span><kbd>Ctrl</kbd>+<kbd>Enter</kbd> 发送</span>
                    <span><kbd>↑</kbd><kbd>↓</kbd> 选择 API</span>
                    <span><kbd>Esc</kbd> 关闭弹窗</span>
                </div>
            </main>
        </div>
    </div>
    
    <div class="curl-modal" id="curlModal">
        <div class="curl-modal-content">
            <h3>📋 cURL 命令</h3>
            <pre id="curlContent"></pre>
            <div class="btn-group">
                <button class="modal-btn close" onclick="closeCurlModal()">关闭</button>
                <button class="modal-btn copy" onclick="copyCurl()">复制</button>
            </div>
        </div>
    </div>

    <script>
        const apiDefinitions = {
            '栏目 API': [
                { path: '/api/column/list', method: 'GET', desc: '栏目列表', params: { pid: {value: '0', desc: '父级ID'} }},
                { path: '/api/column/tree', method: 'GET', desc: '栏目树', params: {}},
                { path: '/api/column/detail', method: 'GET', desc: '栏目详情', params: { id: {value: '1', desc: '栏目ID'} }},
                { path: '/api/column/breadcrumb', method: 'GET', desc: '面包屑', params: { id: {value: '1', desc: '栏目ID'} }}
            ],
            '文章 API': [
                { path: '/api/article/list', method: 'GET', desc: '文章列表', params: { page: {value: '1', desc: '页码'}, pageSize: {value: '15', desc: '每页数量'}}},
                { path: '/api/article/detail', method: 'GET', desc: '文章详情', params: { id: {value: '1', desc: '文章ID'} }},
                { path: '/api/article/recommend', method: 'GET', desc: '推荐文章', params: { limit: {value: '5', desc: '返回数量'}}},
                { path: '/api/article/hot', method: 'GET', desc: '热门文章', params: { limit: {value: '10', desc: '返回数量'}}}
            ],
            '产品 API': [
                { path: '/api/product/list', method: 'GET', desc: '产品列表', params: { page: {value: '1', desc: '页码'}, pageSize: {value: '15', desc: '每页数量'}}},
                { path: '/api/product/detail', method: 'GET', desc: '产品详情', params: { id: {value: '1', desc: '产品ID'} }},
                { path: '/api/product/recommend', method: 'GET', desc: '推荐产品', params: { limit: {value: '5', desc: '返回数量'}}}
            ],
            '内容模块': [
                { path: '/api/other/slides', method: 'GET', desc: '幻灯片', params: { limit: {value: '10', desc: '返回数量'}}},
                { path: '/api/other/links', method: 'GET', desc: '友情链接', params: { limit: {value: '20', desc: '返回数量'}}},
                { path: '/api/other/nav', method: 'GET', desc: '导航菜单', params: {}},
                { path: '/api/other/config', method: 'GET', desc: '系统配置', params: { key: {value: '', desc: '配置键名'}}}
            ],
            '搜索统计': [
                { path: '/api/search', method: 'GET', desc: '全局搜索', params: { keyword: {value: '', desc: '搜索关键词'}}},
                { path: '/api/stats/overview', method: 'GET', desc: '统计概览', params: {}},
                { path: '/api/stats/popular', method: 'GET', desc: '热门内容', params: { type: {value: 'article', desc: '类型'}, limit: {value: '10', desc: '返回数量'}}},
                { path: '/api/tag/hot', method: 'GET', desc: '热门标签', params: { limit: {value: '10', desc: '返回数量'}}}
            ],
            '媒体资源': [
                { path: '/api/images/list', method: 'GET', desc: '图片列表', params: { page: {value: '1', desc: '页码'}, pageSize: {value: '15', desc: '每页数量'}}},
                { path: '/api/video/list', method: 'GET', desc: '视频列表', params: { page: {value: '1', desc: '页码'}, pageSize: {value: '15', desc: '每页数量'}}},
                { path: '/api/download/list', method: 'GET', desc: '下载列表', params: { page: {value: '1', desc: '页码'}, pageSize: {value: '15', desc: '每页数量'}}}
            ]
        };

        let currentApi = null;
        let currentParams = {};
        let requestHistory = [];
        let requestCount = 0;
        let currentController = null;
        let currentUrl = '';
        let currentMethod = 'GET';
        let formattedResponse = '';
        let selectedApiIndex = -1;
        let flatApiList = [];
        let isDarkTheme = false;

        function init() {
            const savedBaseUrl = localStorage.getItem('apiTesterBaseUrl');
            if (savedBaseUrl) {
                document.getElementById('baseUrl').value = savedBaseUrl;
            } else {
                document.getElementById('baseUrl').value = window.location.origin;
            }
            renderApiList();
            flatApiList = Object.values(apiDefinitions).flat();
            initTheme();
            updateParamsCount();
        }

        function toggleTheme() {
            isDarkTheme = !isDarkTheme;
            document.documentElement.setAttribute('data-theme', isDarkTheme ? 'dark' : 'light');
            localStorage.setItem('apiTesterTheme', isDarkTheme ? 'dark' : 'light');
        }

        function initTheme() {
            const saved = localStorage.getItem('apiTesterTheme');
            if (saved === 'dark') {
                isDarkTheme = true;
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        }

        function renderApiList(filter = '') {
            const list = document.getElementById('apiList');
            let html = '';
            filter = filter.toLowerCase();
            
            for (const [category, apis] of Object.entries(apiDefinitions)) {
                const filteredApis = apis.filter(api => 
                    api.path.toLowerCase().includes(filter) || 
                    api.desc.toLowerCase().includes(filter)
                );
                
                if (filteredApis.length === 0 && filter) continue;
                
                html += `<div class="api-category">`;
                html += `<div class="api-category-title" onclick="this.parentElement.classList.toggle('collapsed')">
                    <span>${category}</span>
                    <span class="arrow">▼</span>
                </div>`;
                html += `<div class="api-items">`;
                
                for (const api of filteredApis) {
                    const isActive = currentApi && currentApi.path === api.path;
                    html += `<div class="api-item ${isActive ? 'active' : ''}" onclick="selectApi('${api.path}')">
                        <span class="method ${api.method.toLowerCase()}">${api.method}</span>
                        <span class="path" title="${api.desc}">${api.path}</span>
                    </div>`;
                }
                
                html += `</div></div>`;
            }
            
            list.innerHTML = html || '<div class="empty-state">未找到匹配的 API</div>';
        }

        function filterApis() {
            const query = document.getElementById('searchApi').value;
            renderApiList(query);
        }

        function selectApi(path) {
            const api = flatApiList.find(a => a.path === path);
            if (!api) return;
            
            currentApi = api;
            currentParams = {};
            
            Object.entries(api.params).forEach(([key, param]) => {
                currentParams[key] = param.value;
            });
            
            document.getElementById('method').value = api.method;
            document.getElementById('urlInput').value = api.path;
            currentMethod = api.method;
            currentUrl = api.path;
            
            renderParams();
            renderApiList(document.getElementById('searchApi').value);
            updateParamsCount();
        }

        function renderParams() {
            const grid = document.getElementById('paramsGrid');
            const empty = document.getElementById('paramsEmpty');
            
            if (!currentApi || Object.keys(currentApi.params).length === 0) {
                grid.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            
            empty.style.display = 'none';
            grid.innerHTML = '';
            
            Object.entries(currentApi.params).forEach(([key, param]) => {
                const div = document.createElement('div');
                div.className = 'param-item';
                div.innerHTML = `
                    <label>${key} <span style="color:#999;font-size:10px;">(${param.desc})</span></label>
                    <input type="text" data-key="${key}" value="${currentParams[key] || ''}" placeholder="${param.desc}" onchange="updateParam('${key}', this.value)">
                `;
                grid.appendChild(div);
            });
        }

        function updateParam(key, value) {
            currentParams[key] = value;
        }

        function updateParamsCount() {
            const count = currentApi && currentApi.params ? Object.keys(currentApi.params).length : 0;
            document.getElementById('paramsCount').textContent = count;
        }

        function switchTab(tab) {
            document.querySelectorAll('.request-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.request-tab[data-tab="${tab}"]`).classList.add('active');
            document.getElementById('paramsContent').classList.toggle('hidden', tab !== 'params');
            document.getElementById('headersContent').classList.toggle('hidden', tab !== 'headers');
        }

        async function sendRequest() {
            const baseUrl = document.getElementById('baseUrl').value || window.location.origin;
            let path = document.getElementById('urlInput').value.trim();
            const method = document.getElementById('method').value;
            
            if (!path) {
                alert('请输入接口路径');
                return;
            }
            
            if (!path.startsWith('/')) path = '/' + path;
            
            const params = {};
            document.querySelectorAll('#paramsGrid input').forEach(input => {
                const key = input.dataset.key;
                const value = input.value.trim();
                if (value) params[key] = value;
            });
            
            const paramStr = new URLSearchParams(params).toString();
            const url = baseUrl + path + (paramStr ? '?' + paramStr : '');
            
            currentUrl = url;
            currentMethod = method;
            
            if (currentController) currentController.abort();
            currentController = new AbortController();
            
            updateStatus('pending', '请求中...');
            document.getElementById('responseBox').innerHTML = '<span style="color:#dcdcaa">⏳ 正在请求...\n\n</span>' + escapeHtml(url);
            document.getElementById('sendBtn').disabled = true;
            
            const startTime = Date.now();
            
            try {
                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    mode: 'cors',
                    signal: currentController.signal
                });
                
                const elapsed = Date.now() - startTime;
                const text = await response.text();
                const size = new Blob([text]).size;
                
                requestCount++;
                updateStats(elapsed, size, response.status);
                updateStatus(response.ok ? 'success' : 'error', `${response.status} ${response.statusText}`);
                
                try {
                    const json = JSON.parse(text);
                    formattedResponse = JSON.stringify(json, null, 2);
                    document.getElementById('responseBox').innerHTML = syntaxHighlight(formattedResponse);
                } catch {
                    formattedResponse = text;
                    document.getElementById('responseBox').innerHTML = `<span style="color:${response.ok ? '#4ec9b0' : '#f44747'}">${escapeHtml(text)}</span>`;
                }
                
                addToHistory(method, url, elapsed, response.status);
                
            } catch (error) {
                if (error.name !== 'AbortError') {
                    updateStatus('error', '网络错误');
                    document.getElementById('responseBox').innerHTML = `<span style="color:#f44747">❌ 请求失败\n\n</span>${escapeHtml(error.message)}`;
                    addToHistory(method, url, Date.now() - startTime, '错误');
                }
            } finally {
                document.getElementById('sendBtn').disabled = false;
                currentController = null;
            }
        }

        function updateStatus(type, text) {
            const badge = document.getElementById('statusBadge');
            badge.className = 'status-badge ' + type;
            badge.textContent = text;
        }

        function updateStats(time, size, status) {
            document.getElementById('respTime').textContent = time + ' ms';
            document.getElementById('respSize').textContent = formatBytes(size);
        }

        function syntaxHighlight(json) {
            return escapeHtml(json).replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, match => {
                let cls = 'json-number';
                if (/^"/.test(match)) cls = /:$/.test(match) ? 'json-key' : 'json-string';
                else if (/true|false/.test(match)) cls = 'json-boolean';
                else if (/null/.test(match)) cls = 'json-null';
                return '<span class="' + cls + '">' + match + '</span>';
            }).replace(/([{}\[\]])/g, '<span class="json-bracket json-collapsed">$1</span>');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function clearResponse() {
            document.getElementById('responseBox').innerHTML = '点击发送按钮或使用快捷键发送请求...';
            updateStatus('pending', '-');
            document.getElementById('respTime').textContent = '- ms';
            document.getElementById('respSize').textContent = '-';
            formattedResponse = '';
        }

        function copyResponse() {
            const text = formattedResponse || document.getElementById('responseBox').textContent;
            navigator.clipboard.writeText(text).then(() => {
                showFeedback(event.target, '已复制!');
            });
        }

        function showFeedback(btn, text) {
            const orig = btn.textContent;
            btn.textContent = text;
            setTimeout(() => btn.textContent = orig, 1500);
        }

        function generateCurl() {
            if (!currentUrl) return '';
            try {
                let curl = `curl -X ${currentMethod} '${currentUrl}'`;
                curl += `\n  -H 'Content-Type: application/json'`;
                curl += `\n  -H 'Accept: application/json'`;
                return curl;
            } catch {
                return '# 无法生成 cURL';
            }
        }

        function showCurlModal() {
            if (!currentUrl) {
                alert('请先发送一个请求');
                return;
            }
            document.getElementById('curlContent').textContent = generateCurl();
            document.getElementById('curlModal').classList.add('show');
        }

        function closeCurlModal() {
            document.getElementById('curlModal').classList.remove('show');
        }

        function copyCurl() {
            navigator.clipboard.writeText(generateCurl()).then(() => {
                showFeedback(event.target, '已复制!');
            });
        }

        function addToHistory(method, url, time, status) {
            requestHistory.unshift({ method, url, time, status, timestamp: new Date().toLocaleTimeString() });
            if (requestHistory.length > 20) requestHistory.pop();
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            if (requestHistory.length === 0) {
                list.innerHTML = '<div class="empty-history">暂无请求历史</div>';
                return;
            }
            list.innerHTML = requestHistory.map((item, i) => `
                <div class="history-item" onclick="replayRequest(${i})">
                    <span class="method ${item.method.toLowerCase()}">${item.method}</span>
                    <span class="path">${item.url}</span>
                    <span class="status">${item.status}</span>
                    <span class="time">${item.time}ms</span>
                </div>
            `).join('');
        }

        function replayRequest(index) {
            const item = requestHistory[index];
            try {
                const url = new URL(item.url);
                document.getElementById('baseUrl').value = url.origin;
                document.getElementById('urlInput').value = url.pathname;
                document.getElementById('method').value = item.method;
                currentMethod = item.method;
                currentUrl = item.url;
                
                const params = Object.fromEntries(url.searchParams.entries());
                const api = flatApiList.find(a => a.path === url.pathname);
                if (api) {
                    currentApi = api;
                    currentParams = params;
                    renderParams();
                }
                
                sendRequest();
            } catch {}
        }

        document.getElementById('curlModal').addEventListener('click', function(e) {
            if (e.target === this) closeCurlModal();
        });

        document.getElementById('baseUrl').addEventListener('change', function() {
            localStorage.setItem('apiTesterBaseUrl', this.value);
        });

        document.addEventListener('keydown', e => {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                sendRequest();
            }
            if (e.key === 'Escape') {
                closeCurlModal();
            }
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                const searchInput = document.getElementById('searchApi');
                if (document.activeElement === searchInput) {
                    e.preventDefault();
                    selectedApiIndex = Math.max(-1, Math.min(flatApiList.length - 1, 
                        selectedApiIndex + (e.key === 'ArrowDown' ? 1 : -1)));
                    if (selectedApiIndex >= 0) {
                        selectApi(flatApiList[selectedApiIndex].path);
                    }
                }
            }
        });

        init();
    </script>
</body>
</html>
